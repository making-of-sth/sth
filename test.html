<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIP 단어 배열</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #17191d;
            --panel: #20242a;
            --button: #30353d;
            --button-hover: #3b424c;
            --border: #4a515c
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: #e9edf2;
            font-family: Arial, "Malgun Gothic", sans-serif
        }

        h2 {
            margin: 0 0 14px;
            font-size: 20px
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 12px;
            border-right: 1px solid #3b414a
        }

        .setting-group:last-of-type {
            border-right: none
        }

        label {
            font-size: 14px;
            white-space: nowrap
        }

        input {
            width: 55px;
            padding: 5px 6px;
            background: #15181c;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 5px
        }

        button {
            color: #f5f7fa;
            background: var(--button);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer
        }

        button:hover {
            background: var(--button-hover)
        }

        .control-btn {
            padding: 6px 10px
        }

        #pipBtn {
            padding: 8px 18px;
            font-size: 15px
        }

        .hint {
            margin: 0;
            color: #aeb7c2;
            font-size: 13px;
            line-height: 1.6
        }

        .number-panel {
            width: 100%;
            margin: 0 0 12px;
            padding: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px
        }

        .number-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
            width: 100%
        }

        .number-item {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px
        }

        .number-item label {
            font-size: 11px;
            color: #bfc7d1;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .number-item input,
        .number-result {
            width: 100%;
            height: 32px;
            box-sizing: border-box;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #15181c;
            color: #fff;
            font: 11px Arial, "Malgun Gothic", sans-serif;
            line-height: 1.2
        }

        .number-input-wrap {
            position: relative;
            width: 100%;
            height: 32px;
            min-width: 0
        }

        .number-input-wrap input {
            padding-right: 26px
        }

        .number-clear-btn {
            position: absolute;
            right: 2px;
            top: 2px;
            width: 28px;
            height: 28px;
            padding: 0;
            border: none;
            background: transparent;
            color: #aeb7c2;
            font: 16px/28px Arial, sans-serif;
            text-align: center;
            border-radius: 4px;
            cursor: pointer
        }

        .number-clear-btn:hover {
            background: #30353d;
            color: #fff
        }

        .number-item input {
            outline: none
        }

        .number-item input:focus {
            border-color: #7587a0;
            box-shadow: 0 0 0 2px rgba(117, 135, 160, .15)
        }

        .number-result {
            background: #1b1f24;
            cursor: pointer;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            position: relative
        }

        .number-result:hover {
            background: #242a31
        }

        .number-result::after {
            content: "복사";
            position: absolute;
            right: 4px;
            bottom: 1px;
            font-size: 8px;
            color: #7f8994
        }

        @media(max-width:700px) {
            .number-row {
                grid-template-columns: 1.4fr repeat(4, 1fr)
            }
        }
    </style>
</head>

<body>
    <div class="number-panel" id="mainNumberPanel">
        <div class="number-row">
            <div class="number-item"><label for="numberInput">입력창</label>
                <div class="number-input-wrap"><input type="text" id="numberInput"
                        placeholder="예: 소룡71길 55, fm 91.9..."><button type="button" class="number-clear-btn"
                        id="numberClearBtn" aria-label="입력 지우기">×</button></div>
            </div>
            <div class="number-item"><label>변환 결과 텍스트창1</label>
                <div class="number-result" id="numberOut1"></div>
            </div>
            <div class="number-item"><label>변환 결과 텍스트창2</label>
                <div class="number-result" id="numberOut2"></div>
            </div>
            <div class="number-item"><label>변환 결과 텍스트창3</label>
                <div class="number-result" id="numberOut3"></div>
            </div>
            <div class="number-item"><label>변환 결과 텍스트창4</label>
                <div class="number-result" id="numberOut4"></div>
            </div>
        </div>
    </div>
    <h2>PIP 단어 배열</h2>
    <div class="controls">
        <div class="setting-group">
            <label for="mainColsInput">메인 가로:</label><input type="number" id="mainColsInput" value="12" min="1"
                max="40">
            <label for="mainRowsInput">메인 세로:</label><input type="number" id="mainRowsInput" value="10" min="1"
                max="30">
        </div>
        <div class="setting-group">
            <label for="padColsInput">Numpad 1 가로:</label><input type="number" id="padColsInput" value="10" min="1"
                max="30">
            <label for="padRowsInput">Numpad 1 세로:</label><input type="number" id="padRowsInput" value="10" min="1"
                max="30">
        </div>
        <div class="setting-group">
            <label for="pad2ColsInput">Numpad 2 가로:</label><input type="number" id="pad2ColsInput" value="10" min="1"
                max="30">
            <label for="pad2RowsInput">Numpad 2 세로:</label><input type="number" id="pad2RowsInput" value="10" min="1"
                max="30">
        </div>
        <button class="control-btn" id="applyGridBtn">배열 적용</button>
        <button class="control-btn" id="resetStorageBtn">순서 초기화</button>
        <button id="pipBtn">PIP 열기</button>
    </div>
    <p class="hint">기본 클릭: (단어.) / Ctrl+클릭: 단어 / Alt+클릭: (단어)<br>/로 시작하는 단어는 클릭 방식과 관계없이 그대로 복사됩니다.<br>단어 이동: 버튼을 약 0.5초
        이상 누른 뒤 드래그하면 이동 기능이 활성화됩니다.</p>
    <script>

        const pad2DefaultWords = [

            "N2-011", "N2-012", "N2-013", "N2-014", "N2-015", "N2-016", "N2-017", "N2-018", "N2-019", "N2-020",

            "N2-091", "N2-092", "N2-093", "N2-094", "N2-095", "N2-096", "N2-097", "N2-098", "N2-099", "N2-100"
        ];

        const STORAGE_KEY = "pip_word_layout_v10";
        let mainCols = 12, mainRows = 10, padCols = 10, padRows = 10, pad2Cols = 10, pad2Rows = 10;
        let pipWindow = null, draggedElement = null, suppressClick = false;

        const mainColsInput = document.getElementById("mainColsInput");
        const mainRowsInput = document.getElementById("mainRowsInput");
        const padColsInput = document.getElementById("padColsInput");
        const padRowsInput = document.getElementById("padRowsInput");
        const pad2ColsInput = document.getElementById("pad2ColsInput");
        const pad2RowsInput = document.getElementById("pad2RowsInput");
        const applyGridBtn = document.getElementById("applyGridBtn");
        const resetStorageBtn = document.getElementById("resetStorageBtn");
        const pipBtn = document.getElementById("pipBtn");

        function makeList(source, count) { return Array.from({ length: count }, (_, i) => source[i % source.length]) }
        function extendList(saved, source, count) {
            const result = Array.isArray(saved) ? [...saved] : [];
            while (result.length < count) result.push(source[result.length % source.length]);
            return result.slice(0, count)
        }

        function loadLayout() {
            const mc = mainCols * mainRows, pc = padCols * padRows, p2c = pad2Cols * pad2Rows;
            const fallback = { main: makeList(mainDefaultWords, mc), pad: makeList(padDefaultWords, pc), pad2: makeList(pad2DefaultWords, p2c) };
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return fallback;
            try {
                const parsed = JSON.parse(saved);
                return {
                    main: extendList(parsed.main, mainDefaultWords, mc),
                    pad: extendList(parsed.pad, padDefaultWords, pc),
                    pad2: extendList(parsed.pad2, pad2DefaultWords, p2c)
                }
            } catch (e) { return fallback }
        }

        function saveLayout(grids) {
            const words = g => Array.from(g.querySelectorAll("[data-word]")).map(b => b.dataset.word);
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                main: words(grids.main),
                pad: words(grids.pad),
                pad2: words(grids.pad2)
            }))
        }

        async function copyText(doc, text) {
            try { await doc.defaultView.navigator.clipboard.writeText(text) }
            catch (e) {
                const t = doc.createElement("textarea");
                t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
                doc.body.appendChild(t); t.select(); doc.execCommand("copy"); t.remove()
            }
        }

        function applyButtonStyle(button, gridCols) {
            Object.assign(button.style, {
                minWidth: "0",
                minHeight: "0",
                width: "100%",
                height: "100%",
                padding: "0 5px",
                fontWeight: "500",
                lineHeight: "1",
                fontSize: `clamp(8px, ${Math.max(1.7, 22 / gridCols)}vw, 10px)`,
                border: "1px solid #4a515c",
                borderRadius: "4px",
                background: "#30353d",
                color: "#f4f7fa",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                overflow: "hidden",
                textOverflow: "ellipsis",
                whiteSpace: "nowrap",
                userSelect: "none",
                cursor: "default",
                touchAction: "none", boxSizing: "border-box", maxWidth: "100%", maxHeight: "100%"
            })
        }

        function createWordButton(doc, word, gridCols, grids) {
            const b = doc.createElement("button");
            b.type = "button";
            b.textContent = word;
            b.dataset.word = word;
            b.draggable = false;
            applyButtonStyle(b, gridCols);

            let holdTimer = null, dragReady = false, pointerDown = false, startX = 0, startY = 0;
            const clearHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null } };

            b.addEventListener("pointerdown", e => {
                pointerDown = true; dragReady = false; startX = e.clientX; startY = e.clientY;
                holdTimer = setTimeout(() => {
                    if (!pointerDown) return;
                    dragReady = true;
                    b.draggable = true;
                    b.style.cursor = "grab";
                    b.style.outline = "1px solid #8fa7c4";
                    b.style.outlineOffset = "-1px"
                }, 500)
            });

            b.addEventListener("pointermove", e => {
                if (!dragReady && Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
                    clearHold(); pointerDown = false
                }
            });

            ["pointerup", "pointercancel", "pointerleave"].forEach(type => b.addEventListener(type, () => {
                pointerDown = false;
                clearHold();
                if (!dragReady) {
                    b.draggable = false;
                    b.style.cursor = "default";
                    b.style.outline = "none"
                }
            }));

            b.addEventListener("dragstart", e => {
                if (!dragReady) { e.preventDefault(); return }
                draggedElement = b;
                suppressClick = true;
                b.style.opacity = "0.45";
                b.style.cursor = "grabbing";
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", b.dataset.word)
            });

            b.addEventListener("dragend", () => {
                draggedElement = null;
                dragReady = false;
                b.draggable = false;
                b.style.opacity = "1";
                b.style.cursor = "default";
                b.style.outline = "none";
                setTimeout(() => suppressClick = false, 80)
            });

            b.addEventListener("dragover", e => {
                if (draggedElement && draggedElement !== b) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "move"
                }
            });

            b.addEventListener("dragenter", e => {
                e.preventDefault();
                if (draggedElement && draggedElement !== b) b.style.background = "#414955"
            });

            b.addEventListener("dragleave", () => b.style.background = "#30353d");

            b.addEventListener("drop", e => {
                e.preventDefault();
                if (!draggedElement || draggedElement === b) return;
                const w = b.dataset.word, t = b.textContent;
                b.dataset.word = draggedElement.dataset.word;
                b.textContent = draggedElement.textContent;
                draggedElement.dataset.word = w;
                draggedElement.textContent = t;
                b.style.background = "#30353d";
                saveLayout(grids)
            });

            b.addEventListener("click", async e => {
                if (suppressClick || dragReady) return;
                const w = b.dataset.word;
                const text = w.startsWith("/") ? w : e.ctrlKey ? w : e.altKey ? `(${w})` : `(${w}.)`;
                await copyText(doc, text);
                b.style.background = "#5a6a7c";
                setTimeout(() => b.style.background = "#30353d", 140)
            });

            return b
        }

        function createGrid(root, doc) {
            root.innerHTML = "";

            const wrapper = doc.createElement("div");
            Object.assign(wrapper.style, {
                boxSizing: "border-box",
                position: "absolute",
                inset: "0",
                width: "100%",
                height: "100%",
                display: "grid",
                gridTemplateRows: "54px minmax(0,1fr)",
                gridTemplateColumns: "1fr",
                gap: "0",
                padding: "6px 12px 12px 6px",
                background: "#17191d",
                overflow: "hidden"
            });

            const numberPanel = doc.createElement("div");
            Object.assign(numberPanel.style, {
                boxSizing: "border-box",
                width: "75%",
                height: "46px",
                padding: "4px 6px",
                margin: "0 auto",
                background: "#20242a",
                border: "1px solid #4a515c",
                borderRadius: "6px",
                overflow: "hidden"
            });
            const numberRow = doc.createElement("div");
            Object.assign(numberRow.style, {
                boxSizing: "border-box",
                width: "100%",
                height: "100%",
                display: "grid",
                gridTemplateColumns: "1.4fr 1fr 1fr 1fr 1fr",
                gridTemplateRows: "1fr",
                gap: "5px",
                alignItems: "stretch",
                minWidth: "0"
            });
            function makeNumberItem(labelText, element) {
                const item = doc.createElement("div");
                Object.assign(item.style, { minWidth: "0", height: "100%", display: "flex", flexDirection: "column", gap: "2px", overflow: "hidden" });
                const label = doc.createElement("div");
                label.textContent = labelText;
                Object.assign(label.style, { fontSize: "9px", lineHeight: "11px", height: "11px", color: "#bfc7d1", textAlign: "center", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", flex: "0 0 auto" });
                item.append(label, element);
                return item;
            }
            const pipInputWrap = doc.createElement("div");
            Object.assign(pipInputWrap.style, { position: "relative", width: "100%", height: "26px", minWidth: "0" });
            const pipInput = doc.createElement("input");
            pipInput.type = "text";
            pipInput.id = "pipNumberInput";
            pipInput.placeholder = "예: 판교역로 160, fm 91.9...";
            Object.assign(pipInput.style, { width: "100%", height: "26px", minWidth: "0", boxSizing: "border-box", padding: "3px 24px 3px 7px", border: "1px solid #4a515c", borderRadius: "4px", background: "#15181c", color: "#fff", font: "11px Arial, 'Malgun Gothic', sans-serif", outline: "none" });
            const pipClearBtn = doc.createElement("button");
            pipClearBtn.type = "button";
            pipClearBtn.textContent = "×";
            pipClearBtn.setAttribute("aria-label", "입력 지우기");
            Object.assign(pipClearBtn.style, { position: "absolute", right: "2px", top: "1px", width: "24px", height: "24px", padding: "0", border: "none", background: "transparent", color: "#aeb7c2", font: "15px/24px Arial,sans-serif", textAlign: "center", borderRadius: "4px", cursor: "pointer" });
            pipClearBtn.addEventListener("mouseenter", () => { pipClearBtn.style.background = "#30353d"; pipClearBtn.style.color = "#fff" });
            pipClearBtn.addEventListener("mouseleave", () => { pipClearBtn.style.background = "transparent"; pipClearBtn.style.color = "#aeb7c2" });
            pipInputWrap.append(pipInput, pipClearBtn);
            function makeOut(id) {
                const out = doc.createElement("div");
                out.id = id;
                Object.assign(out.style, { width: "100%", height: "26px", minWidth: "0", boxSizing: "border-box", padding: "3px 7px", border: "1px solid #4a515c", borderRadius: "4px", background: "#1b1f24", color: "#fff", font: "11px Arial, 'Malgun Gothic', sans-serif", lineHeight: "1.2", whiteSpace: "pre-wrap", wordBreak: "break-all", overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "flex-start", textAlign: "left", cursor: "pointer", position: "relative" });
                out.title = "클릭하여 복사";
                return out;
            }
            numberRow.append(
                makeNumberItem("입력창", pipInputWrap),
                makeNumberItem("변환 결과 텍스트창1", makeOut("pipNumberOut1")),
                makeNumberItem("변환 결과 텍스트창2", makeOut("pipNumberOut2")),
                makeNumberItem("변환 결과 텍스트창3", makeOut("pipNumberOut3")),
                makeNumberItem("변환 결과 텍스트창4", makeOut("pipNumberOut4"))
            );
            numberPanel.appendChild(numberRow);

            const gridArea = doc.createElement("div");
            Object.assign(gridArea.style, { minWidth: "0", minHeight: "0", width: "100%", height: "100%", overflow: "hidden" });

            const gridFlex = doc.createElement("div");

                width: "100%", height: "100%",

                overflow: "hidden"
            });

            const main = doc.createElement("div");
            const pad = doc.createElement("div");
            const pad2 = doc.createElement("div");
            const grids = { main, pad, pad2 };

            Object.assign(main.style, {
                boxSizing: "border-box",
                minWidth: "0",
                minHeight: "0",
                width: "100%",
                height: "100%",
                display: "grid",
                gridTemplateColumns: `repeat(${mainCols}, minmax(0,1fr))`,
                gridTemplateRows: `repeat(${mainRows}, minmax(0,1fr))`,
                gap: "3px",
                overflow: "hidden"
            });

            Object.assign(pad.style, {
                boxSizing: "border-box",
                minWidth: "0",
                minHeight: "0",
                width: "100%",
                height: "100%",
                paddingLeft: "10px",
                borderLeft: "5px solid #252a31",
                display: "grid",
                gridTemplateColumns: `repeat(${padCols}, minmax(0,1fr))`,
                gridTemplateRows: `repeat(${padRows}, minmax(0,1fr))`,
                gap: "3px",
                overflow: "hidden"
            });

            Object.assign(pad2.style, {
                boxSizing: "border-box",
                minWidth: "0",
                minHeight: "0",
                width: "100%",
                height: "100%",
                paddingLeft: "10px",
                borderLeft: "5px solid #252a31",
                display: "grid",
                gridTemplateColumns: `repeat(${pad2Cols}, minmax(0,1fr))`,
                gridTemplateRows: `repeat(${pad2Rows}, minmax(0,1fr))`,
                gap: "3px",
                overflow: "hidden"
            });

            const layout = loadLayout();
            layout.main.forEach(w => main.appendChild(createWordButton(doc, w, mainCols, grids)));
            layout.pad.forEach(w => pad.appendChild(createWordButton(doc, w, padCols, grids)));
            layout.pad2.forEach(w => pad2.appendChild(createWordButton(doc, w, pad2Cols, grids)));

            gridFlex.append(main, pad, pad2);
            gridArea.appendChild(gridFlex);
            wrapper.appendChild(gridArea);
            root.appendChild(wrapper);

            const pipInputEl = doc.getElementById("pipNumberInput");
            if (pipInputEl) {
                const savedInput = document.getElementById("numberInput");
                pipInputEl.value = savedInput ? savedInput.value : "";
                pipInputEl.addEventListener("input", () => {
                    processNumber(doc, pipInputEl.value, "pip");
                    const mainInput = document.getElementById("numberInput");
                    if (mainInput && mainInput.value !== pipInputEl.value) {
                        mainInput.value = pipInputEl.value;
                        processNumber(document, pipInputEl.value, "main");
                    }
                });
                pipInputEl.addEventListener("keydown", e => e.stopPropagation());
                pipClearBtn.addEventListener("click", () => {
                    pipInputEl.value = "";
                    processNumber(doc, "", "pip");
                    const mainInput = document.getElementById("numberInput");
                    if (mainInput) { mainInput.value = ""; processNumber(document, "", "main"); }
                    pipInputEl.focus();
                });
                ["pipNumberOut1", "pipNumberOut2", "pipNumberOut3", "pipNumberOut4"].forEach(id => {
                    const el = doc.getElementById(id);
                    if (el) el.addEventListener("click", () => copyText(doc, el.textContent));
                });
                processNumber(doc, pipInputEl.value, "pip");
            }
        }


        const numberUnits = ["", "십", "백", "천", "만"];
        const numberNums = ["공", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
        const alphabetNums = {
            a: "에이", b: "비", c: "씨", d: "디", e: "이", f: "에프", g: "지", h: "에이치", i: "아이", j: "제이",
            k: "케이", l: "엘", m: "엠", n: "엔", o: "오", p: "피", q: "큐", r: "알", s: "에스", t: "티",
            u: "유", v: "브이", w: "더블유", x: "엑스", y: "와이", z: "지"
        };

        function readComplexNumber(numStr) {
            if (!numStr) return "";
            let n = parseInt(numStr, 10);
            if (n === 0) return "영";
            let res = "", len = numStr.length;
            for (let i = 0; i < len; i++) {
                let digit = parseInt(numStr[i], 10);
                let power = len - i - 1;
                if (digit !== 0) {
                    if (digit === 1 && power > 0) res += numberUnits[power];
                    else res += numberNums[digit] + numberUnits[power];
                }
            }
            return res;
        }

        function readEachNumber(numStr) {
            return numStr.split("").map(c => numberNums[parseInt(c, 10)]).join("");
        }

        function readAlphaNumeric(text, mode) {
            let result = "";
            let i = 0;
            while (i < text.length) {
                let c = text[i];
                if (/[A-Za-z]/.test(c)) {
                    let start = i;
                    while (i < text.length && /[A-Za-z]/.test(text[i])) i++;
                    let letters = text.slice(start, i).toLowerCase();
                    result += letters.split("").map(ch => alphabetNums[ch] || ch).join("");
                } else if (/\d/.test(c)) {
                    let start = i;
                    while (i < text.length && /\d/.test(text[i])) i++;
                    result += readComplexNumber(text.slice(start, i));
                } else {
                    result += c;
                    i++;
                }
            }
            return result;
        }

        function convertNumberBlock(numStr, mode) {
            if (numStr.includes(".")) {
                let parts = numStr.split(".");
                let p1 = (mode === 1 || mode === 3) ? readComplexNumber(parts[0]) : readEachNumber(parts[0]);
                let p2 = readEachNumber(parts[1]);
                return p1 + "점" + p2;
            }
            if (numStr.includes("-")) {
                let parts = numStr.split("-");
                let p1 = (mode === 1 || mode === 3) ? readComplexNumber(parts[0]) : readEachNumber(parts[0]);
                let p2 = (mode === 1 || mode === 4) ? readComplexNumber(parts[1]) : readEachNumber(parts[1]);
                return p1 + "다시" + p2;
            }
            return (mode === 1 || mode === 3) ? readComplexNumber(numStr) : readEachNumber(numStr);
        }

        function parseNumberText(text, mode) {
            if (!text.trim()) return "";
            let resText = text;
            let protectedBlocks = [];
            function protect(value) {
                const key = `\uE000${String.fromCharCode(0xE100 + protectedBlocks.length)}\uE001`;
                protectedBlocks.push(value);
                return key;
            }


            const roadNoHyphenRegex = /(^|\s)([가-힣A-Za-z·]+?)([0-9]+)(길|번길)\s+([0-9]+)(?=\s|$)/g;
            resText = resText.replace(roadNoHyphenRegex, function (match, lead, roadName, streetNum, roadSuffix, building) {
                const streetKor = convertNumberBlock(streetNum, (mode === 1 || mode === 3) ? 1 : 2);
                const buildingKor = convertNumberBlock(building, (mode === 1 || mode === 4) ? 1 : 4);
                return protect(`${lead}${roadName}[${streetNum}/${streetKor}]${roadSuffix} [${building}/${buildingKor}]`);
            });


            const roadHyphenRegex = /(^|\s)([가-힣A-Za-z·]+?)([0-9]+-[0-9]+)(길|번길)\s+([0-9]+(?:-[0-9]+)?)(?=\s|$)/g;
            resText = resText.replace(roadHyphenRegex, function (match, lead, roadName, streetNum, roadSuffix, building) {
                const streetKor = convertNumberBlock(streetNum, (mode === 1 || mode === 3) ? 1 : 2);
                const buildingKor = convertNumberBlock(building, (mode === 1 || mode === 4) ? 1 : 4);
                return protect(`${lead}${roadName}[${streetNum}/${streetKor}]${roadSuffix} [${building}/${buildingKor}]`);
            });


            resText = resText.replace(/\b(fm|am)\s+([0-9.]+)/ig, function (match, rad, num) {
                const radKor = rad.toLowerCase() === "fm" ? "에프엠" : "에이엠";
                const numKor = convertNumberBlock(num, mode);
                return protect(`[${match}/${radKor} ${numKor}]`);
            });
            resText = resText.replace(/([0-9.]+)\s+(fm|am)\b/ig, function (match, num, rad) {
                const radKor = rad.toLowerCase() === "fm" ? "에프엠" : "에이엠";
                const numKor = convertNumberBlock(num, mode);
                return protect(`[${match}/${numKor} ${radKor}]`);
            });
            resText = resText.replace(/\b(fm|am)\b/ig, function (match) {
                const radKor = match.toLowerCase() === "fm" ? "에프엠" : "에이엠";
                return protect(`[${match}/${radKor}]`);
            });


            const alphaPattern = /(?<![A-Za-z0-9\[])([A-Za-z]+(?:[0-9]+)?)(?![A-Za-z0-9\]])/g;
            resText = resText.replace(alphaPattern, function (match) {
                return protect(`[${match}/${readAlphaNumeric(match, mode)}]`);
            });


            const numPattern = /(\d+[.-]\d+|\d+)/g;
            resText = resText.replace(numPattern, function (match) {
                return `[${match}/${convertNumberBlock(match, mode)}]`;
            });


            resText = resText.replace(/\uE000([\uE100-\uE1FF])\uE001/g, function (_, ch) {
                return protectedBlocks[ch.charCodeAt(0) - 0xE100];
            });
            return resText;
        }

        function processNumber(doc, text, scope = "main") {
            const ids = scope === "pip" ? ["pipNumberOut1", "pipNumberOut2", "pipNumberOut3", "pipNumberOut4"] : ["numberOut1", "numberOut2", "numberOut3", "numberOut4"];
            ids.forEach((id, i) => {
                const el = doc.getElementById(id);
                if (el) el.textContent = parseNumberText(text, i + 1);
            });
        }

        function setupMainNumber() {
            const input = document.getElementById("numberInput");
            if (!input) return;
            input.addEventListener("input", () => {
                processNumber(document, input.value, "main");
                if (pipWindow) {
                    const pipInput = pipWindow.document.getElementById("pipNumberInput");
                    if (pipInput && pipInput.value !== input.value) {
                        pipInput.value = input.value;
                        processNumber(pipWindow.document, input.value, "pip");
                    }
                }
            });
            input.addEventListener("keydown", e => e.stopPropagation());
            const clearBtn = document.getElementById("numberClearBtn");
            if (clearBtn) {
                clearBtn.addEventListener("click", () => {
                    input.value = "";
                    processNumber(document, "", "main");
                    if (pipWindow) {
                        const pipInput = pipWindow.document.getElementById("pipNumberInput");
                        if (pipInput) { pipInput.value = ""; processNumber(pipWindow, "", "pip"); pipInput.focus(); }
                    }
                    input.focus();
                });
            }
            ["numberOut1", "numberOut2", "numberOut3", "numberOut4"].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener("click", () => copyText(document, el.textContent));
            });
            processNumber(document, input.value, "main");
        }

        async function openPIP() {
            if (!("documentPictureInPicture" in window)) {
                alert("이 브라우저는 Document Picture-in-Picture API를 지원하지 않습니다.");
                return
            }
            if (pipWindow) { pipWindow.close(); return }

            pipWindow = await window.documentPictureInPicture.requestWindow({
                width: 2100,
                height: 344
            });

            const d = pipWindow.document;
            d.documentElement.style.width = "100%";
            d.documentElement.style.height = "100%";

            Object.assign(d.body.style, {
                margin: "0",
                padding: "0",
                width: "100%",
                height: "100%",
                overflow: "hidden",
                background: "#17191d"
            });

            const root = d.createElement("div");
            root.id = "pipGridContainer";
            Object.assign(root.style, {
                boxSizing: "border-box",
                position: "fixed",
                top: "0",
                right: "0",
                bottom: "0",
                left: "0",
                width: "100%",
                height: "100%",
                overflow: "hidden"
            });

            d.body.appendChild(root);
            createGrid(root, d);
            pipWindow.addEventListener("pagehide", () => pipWindow = null)
        }

        applyGridBtn.addEventListener("click", () => {
            mainCols = Math.max(1, parseInt(mainColsInput.value) || 12);
            mainRows = Math.max(1, parseInt(mainRowsInput.value) || 10);
            padCols = Math.max(1, parseInt(padColsInput.value) || 10);
            padRows = Math.max(1, parseInt(padRowsInput.value) || 10);
            pad2Cols = Math.max(1, parseInt(pad2ColsInput.value) || 10);
            pad2Rows = Math.max(1, parseInt(pad2RowsInput.value) || 10);

            if (pipWindow) {
                const root = pipWindow.document.getElementById("pipGridContainer");
                if (root) createGrid(root, pipWindow.document)
            }
        });

        resetStorageBtn.addEventListener("click", () => {
            if (!confirm("모든 배열의 단어 순서를 초기 상태로 되돌리겠습니까?")) return;
            localStorage.removeItem(STORAGE_KEY);
            if (pipWindow) {
                const root = pipWindow.document.getElementById("pipGridContainer");
                if (root) createGrid(root, pipWindow.document)
            }
        });

        pipBtn.addEventListener("click", openPIP);
        setupMainNumber();
    </script>
