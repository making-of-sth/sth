<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIP 단어 배열</title>
<style>
:root{color-scheme:dark;--bg:#17191d;--panel:#20242a;--button:#30353d;--button-hover:#3b424c;--border:#4a515c}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:#e9edf2;font-family:Arial,"Malgun Gothic",sans-serif}
h2{margin:0 0 14px;font-size:20px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px}
.setting-group{display:flex;align-items:center;gap:6px;padding-right:12px;border-right:1px solid #3b414a}
.setting-group:last-of-type{border-right:none}
label{font-size:14px;white-space:nowrap}
input{width:55px;padding:5px 6px;background:#15181c;color:#fff;border:1px solid var(--border);border-radius:5px}
button{color:#f5f7fa;background:var(--button);border:1px solid var(--border);border-radius:6px;cursor:pointer}
button:hover{background:var(--button-hover)}
.control-btn{padding:6px 10px}
#pipBtn{padding:8px 18px;font-size:15px}
.hint{margin:0;color:#aeb7c2;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<h2>PIP 단어 배열</h2>
<div class="controls">
<div class="setting-group">
<label for="mainColsInput">메인 가로:</label><input type="number" id="mainColsInput" value="12" min="1" max="40">
<label for="mainRowsInput">메인 세로:</label><input type="number" id="mainRowsInput" value="6" min="1" max="30">
</div>
<div class="setting-group">
<label for="padColsInput">Numpad 1 가로:</label><input type="number" id="padColsInput" value="6" min="1" max="20">
<label for="padRowsInput">Numpad 1 세로:</label><input type="number" id="padRowsInput" value="6" min="1" max="30">
</div>
<div class="setting-group">
<label for="pad2ColsInput">Numpad 2 가로:</label><input type="number" id="pad2ColsInput" value="6" min="1" max="20">
<label for="pad2RowsInput">Numpad 2 세로:</label><input type="number" id="pad2RowsInput" value="6" min="1" max="30">
</div>
<button class="control-btn" id="applyGridBtn">배열 적용</button>
<button class="control-btn" id="resetStorageBtn">순서 초기화</button>
<button id="pipBtn">PIP 열기</button>
</div>
<p class="hint">기본 클릭: (단어.) / Ctrl+클릭: 단어 / Alt+클릭: (단어)<br>/로 시작하는 단어는 클릭 방식과 관계없이 그대로 복사됩니다.<br>단어 이동: 버튼을 약 0.5초 이상 누른 뒤 드래그하면 이동 기능이 활성화됩니다.</p>
<script>
const mainDefaultWords=[
"우리집","사과","바나나","호랑이","컴퓨터","자동차","하늘","바다","축구","노래","책상","의자",
"커피","노트북","스마트폰","자전거","비행기","기차","연필","지우개","안경","시계","지갑","가방",
"수박","포도","오렌지","딸기","복숭아","체리","강아지","고양이","토끼","다람쥐","곰","사자",
"태양","달빛","별들","구름","우산","장화","피자","치킨","라면","김밥","떡볶이","튀김",
"서울","부산","제주","뉴욕","파리","런던","축제","영화","음악","미술","사진","거울",
"나무","장미","튤립","바람","바위","모래","시작","끝남","행복","사랑","우정","희망"
];

const padDefaultWords=[
"N1-01","N1-02","N1-03","N1-04","N1-05","N1-06",
"N1-07","N1-08","N1-09","N1-10","N1-11","N1-12",
"N1-13","N1-14","N1-15","N1-16","N1-17","N1-18",
"N1-19","N1-20","N1-21","N1-22","N1-23","N1-24",
"N1-25","N1-26","N1-27","N1-28","N1-29","N1-30",
"N1-31","N1-32","N1-33","N1-34","N1-35","N1-36"
];

const pad2DefaultWords=[
"N2-01","N2-02","N2-03","N2-04","N2-05","N2-06",
"N2-07","N2-08","N2-09","N2-10","N2-11","N2-12",
"N2-13","N2-14","N2-15","N2-16","N2-17","N2-18",
"N2-19","N2-20","N2-21","N2-22","N2-23","N2-24",
"N2-25","N2-26","N2-27","N2-28","N2-29","N2-30",
"N2-31","N2-32","N2-33","N2-34","N2-35","N2-36"
];

const STORAGE_KEY="pip_word_layout_v8";
let mainCols=12,mainRows=6,padCols=6,padRows=6,pad2Cols=6,pad2Rows=6;
let pipWindow=null,draggedElement=null,suppressClick=false;

const mainColsInput=document.getElementById("mainColsInput");
const mainRowsInput=document.getElementById("mainRowsInput");
const padColsInput=document.getElementById("padColsInput");
const padRowsInput=document.getElementById("padRowsInput");
const pad2ColsInput=document.getElementById("pad2ColsInput");
const pad2RowsInput=document.getElementById("pad2RowsInput");
const applyGridBtn=document.getElementById("applyGridBtn");
const resetStorageBtn=document.getElementById("resetStorageBtn");
const pipBtn=document.getElementById("pipBtn");

function makeList(source,count){return Array.from({length:count},(_,i)=>source[i%source.length])}
function extendList(saved,source,count){const result=Array.isArray(saved)?[...saved]:[];while(result.length<count)result.push(source[result.length%source.length]);return result.slice(0,count)}

function loadLayout(){
const mc=mainCols*mainRows,pc=padCols*padRows,p2c=pad2Cols*pad2Rows;
const fallback={main:makeList(mainDefaultWords,mc),pad:makeList(padDefaultWords,pc),pad2:makeList(pad2DefaultWords,p2c)};
const saved=localStorage.getItem(STORAGE_KEY);
if(!saved)return fallback;
try{
const parsed=JSON.parse(saved);
return{main:extendList(parsed.main,mainDefaultWords,mc),pad:extendList(parsed.pad,padDefaultWords,pc),pad2:extendList(parsed.pad2,pad2DefaultWords,p2c)}
}catch(e){return fallback}
}

function saveLayout(grids){
const words=g=>Array.from(g.querySelectorAll("[data-word]")).map(b=>b.dataset.word);
localStorage.setItem(STORAGE_KEY,JSON.stringify({main:words(grids.main),pad:words(grids.pad),pad2:words(grids.pad2)}))
}

async function copyText(doc,text){
try{await doc.defaultView.navigator.clipboard.writeText(text)}
catch(e){
const t=doc.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";
doc.body.appendChild(t);t.select();doc.execCommand("copy");t.remove()
}
}

function applyButtonStyle(button,gridCols){
Object.assign(button.style,{
minWidth:"0",minHeight:"0",padding:"1px 8px",fontWeight:"500",
fontSize:`clamp(8px, ${Math.max(1.7, 22 / gridCols)}vw, 10px)`,
border:"1px solid #4a515c",borderRadius:"4px",background:"#30353d",color:"#f4f7fa",
display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",
textOverflow:"ellipsis",whiteSpace:"nowrap",userSelect:"none",cursor:"default",touchAction:"none"
})
}

function createWordButton(doc,word,gridCols,grids){
const b=doc.createElement("button");
b.type="button";b.textContent=word;b.dataset.word=word;b.draggable=false;applyButtonStyle(b,gridCols);
let holdTimer=null,dragReady=false,pointerDown=false,startX=0,startY=0;
const clearHold=()=>{if(holdTimer){clearTimeout(holdTimer);holdTimer=null}};

b.addEventListener("pointerdown",e=>{
pointerDown=true;dragReady=false;startX=e.clientX;startY=e.clientY;
holdTimer=setTimeout(()=>{if(!pointerDown)return;dragReady=true;b.draggable=true;b.style.cursor="grab";b.style.outline="1px solid #8fa7c4";b.style.outlineOffset="-1px"},500)
});
b.addEventListener("pointermove",e=>{if(!dragReady&&Math.hypot(e.clientX-startX,e.clientY-startY)>8){clearHold();pointerDown=false}});
["pointerup","pointercancel","pointerleave"].forEach(type=>b.addEventListener(type,()=>{pointerDown=false;clearHold();if(!dragReady){b.draggable=false;b.style.cursor="default";b.style.outline="none"}}));

b.addEventListener("dragstart",e=>{
if(!dragReady){e.preventDefault();return}
draggedElement=b;suppressClick=true;b.style.opacity="0.45";b.style.cursor="grabbing";
e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",b.dataset.word)
});
b.addEventListener("dragend",()=>{
draggedElement=null;dragReady=false;b.draggable=false;b.style.opacity="1";b.style.cursor="default";b.style.outline="none";
setTimeout(()=>suppressClick=false,80)
});
b.addEventListener("dragover",e=>{if(draggedElement&&draggedElement!==b){e.preventDefault();e.dataTransfer.dropEffect="move"}});
b.addEventListener("dragenter",e=>{e.preventDefault();if(draggedElement&&draggedElement!==b)b.style.background="#414955"});
b.addEventListener("dragleave",()=>b.style.background="#30353d");
b.addEventListener("drop",e=>{
e.preventDefault();if(!draggedElement||draggedElement===b)return;
const w=b.dataset.word,t=b.textContent;b.dataset.word=draggedElement.dataset.word;b.textContent=draggedElement.textContent;
draggedElement.dataset.word=w;draggedElement.textContent=t;b.style.background="#30353d";saveLayout(grids)
});

b.addEventListener("click",async e=>{
if(suppressClick||dragReady)return;
const w=b.dataset.word;
const text=w.startsWith("/")?w:e.ctrlKey?w:e.altKey?`(${w})`:`(${w}.)`;
await copyText(doc,text);b.style.background="#5a6a7c";setTimeout(()=>b.style.background="#30353d",140)
});
return b
}

function createGrid(root,doc){
root.innerHTML="";
const wrapper=doc.createElement("div");
Object.assign(wrapper.style,{width:"100%",height:"100%",display:"flex",alignItems:"stretch",gap:"18px",padding:"5px",background:"#17191d"});

const main=doc.createElement("div"),pad=doc.createElement("div"),pad2=doc.createElement("div");
const grids={main,pad,pad2};

Object.assign(main.style,{flex:"1 1 56%",minWidth:"0",display:"grid",gridTemplateColumns:`repeat(${mainCols}, minmax(0,1fr))`,gridTemplateRows:`repeat(${mainRows}, minmax(0,1fr))`,gap:"5px"});
Object.assign(pad.style,{flex:"1 1 22%",minWidth:"0",paddingLeft:"14px",borderLeft:"7px solid #252a31",display:"grid",gridTemplateColumns:`repeat(${padCols}, minmax(0,1fr))`,gridTemplateRows:`repeat(${padRows}, minmax(0,1fr))`,gap:"5px"});
Object.assign(pad2.style,{flex:"1 1 22%",minWidth:"0",paddingLeft:"14px",borderLeft:"7px solid #252a31",display:"grid",gridTemplateColumns:`repeat(${pad2Cols}, minmax(0,1fr))`,gridTemplateRows:`repeat(${pad2Rows}, minmax(0,1fr))`,gap:"5px"});

const layout=loadLayout();
layout.main.forEach(w=>main.appendChild(createWordButton(doc,w,mainCols,grids)));
layout.pad.forEach(w=>pad.appendChild(createWordButton(doc,w,padCols,grids)));
layout.pad2.forEach(w=>pad2.appendChild(createWordButton(doc,w,pad2Cols,grids)));

wrapper.append(main,pad,pad2);root.appendChild(wrapper)
}

async function openPIP(){
if(!("documentPictureInPicture" in window)){alert("이 브라우저는 Document Picture-in-Picture API를 지원하지 않습니다.");return}
if(pipWindow){pipWindow.close();return}
pipWindow=await window.documentPictureInPicture.requestWindow({width:1800,height:260});
const d=pipWindow.document;d.documentElement.style.height="100%";
Object.assign(d.body.style,{margin:"0",width:"100vw",height:"100vh",overflow:"hidden",background:"#17191d"});
const root=d.createElement("div");root.id="pipGridContainer";root.style.width="100%";root.style.height="100%";d.body.appendChild(root);
createGrid(root,d);pipWindow.addEventListener("pagehide",()=>pipWindow=null)
}

applyGridBtn.addEventListener("click",()=>{
mainCols=Math.max(1,parseInt(mainColsInput.value)||12);mainRows=Math.max(1,parseInt(mainRowsInput.value)||6);
padCols=Math.max(1,parseInt(padColsInput.value)||6);padRows=Math.max(1,parseInt(padRowsInput.value)||6);
pad2Cols=Math.max(1,parseInt(pad2ColsInput.value)||6);pad2Rows=Math.max(1,parseInt(pad2RowsInput.value)||6);
if(pipWindow){const root=pipWindow.document.getElementById("pipGridContainer");if(root)createGrid(root,pipWindow.document)}
});

resetStorageBtn.addEventListener("click",()=>{
if(!confirm("모든 배열의 단어 순서를 초기 상태로 되돌리겠습니까?"))return;
localStorage.removeItem(STORAGE_KEY);
if(pipWindow){const root=pipWindow.document.getElementById("pipGridContainer");if(root)createGrid(root,pipWindow.document)}
});

pipBtn.addEventListener("click",openPIP);
</script>
</body>
</html>
